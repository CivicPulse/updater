name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q -m "not browser"
      - run: uv run --locked bandit -r src -c pyproject.toml
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
          cache: true
      - run: trivy fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .venv .
      - run: trivy fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .venv .
      - run: trivy fs --scanners secret --exit-code 1 --skip-dirs .venv .
      - run: uv build
      - run: docker build -t civpulse-updater:check .
      - run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 civpulse-updater:check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.5"
      - run: uv sync --locked --extra browser
      - run: uv run --extra browser playwright install --with-deps chromium firefox
      - run: uv run --locked --extra browser pytest -q -m browser
