[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civpulse-updater"
version = "0.1.0"
description = "Review-only collection of official civic and legislative records"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.13,<5",
  "filelock>=4.2.1,<5",
  "httpx>=0.28,<0.29",
  "icalendar>=6.3,<8",
  "loguru>=0.7,<0.8",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "tzdata>=2025.2",
  "recurring-ical-events>=3.8,<4",
  "websockets>=15,<16",
]

[project.scripts]
civpulse-updater = "civpulse_updater.cli:app"

[project.optional-dependencies]
browser = [
    "playwright>=1.58,<2",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "trustme>=1.2,<2",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires optional Playwright and installed Chromium"]
